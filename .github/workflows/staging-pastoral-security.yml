name: Staging pastoral security acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-security:
    runs-on: ubuntu-latest
    environment: gwcc-staging-security
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/staging-pastoral-security.mjs
