<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" width="100%" height="100%" fill="none">
  <!-- Prophet Elisha K. Richard Official Ecclesiastical Signature -->
  <g stroke="#0f388a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Capital 'E' -->
    <!-- Upper loop of E -->
