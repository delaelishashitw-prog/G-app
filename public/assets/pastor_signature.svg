    <!-- 'd' in Richard -->
    <path d="M 1030,202 C 1026,192 1018,190 1012,198 C 1006,206 1008,218 1016,222 C 1022,224 1030,216 1034,205 L 1034,130 C 1034,115 1040,112 1045,116 C 1048,122 1045,160 1044,210 C 1044,225 1048,230 1056,226 C 1064,220 1072,205 1078,192" stroke-width="5.5" fill="none" />
  </g>
</svg>
