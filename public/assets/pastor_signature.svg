    <!-- 's' in Elisha -->
    <path d="M 302,180 C 308,160 320,145 328,148 C 335,152 332,170 322,185 C 315,196 322,202 334,196 C 342,190 348,178 352,165" stroke-width="5.2" fill="none" />

