    <!-- Head of R (upper loop) -->
    <path d="M 700,55 C 730,55 775,70 778,105 C 780,135 750,165 705,172 C 690,175 680,172 682,170" stroke-width="6.2" fill="none" />
    <!-- Leg of R -->
    <path d="M 700,172 C 715,185 735,215 750,238 C 758,245 765,242 770,228" stroke-width="5.8" fill="none" />

    <!-- 'i' in Richard -->
    <path d="M 770,228 C 778,205 788,188 794,195 C 798,202 792,225 802,234 C 808,236 814,228 820,215" stroke-width="5.2" fill="none" />
    <!-- dot of i in Richard -->
    <circle cx="798" cy="168" r="4.2" fill="#0f388a" stroke="none" />

    <!-- 'c' in Richard -->
    <path d="M 822,212 C 825,198 835,190 842,192 C 848,195 842,215 835,225 C 828,235 838,238 848,230 C 855,225 860,215 865,202" stroke-width="5.2" fill="none" />

    <!-- 'h' in Richard -->
    <path d="M 865,202 C 875,160 892,105 906,108 C 915,110 910,140 898,190 C 894,212 892,232 896,232 C 904,232 915,205 926,205 C 934,205 932,220 936,230 C 940,235 948,230 955,218" stroke-width="5.5" fill="none" />

    <!-- 'a' in Richard -->
    <path d="M 955,218 C 952,205 942,200 936,208 C 930,216 932,228 942,232 C 950,234 958,224 962,212 C 964,220 966,230 972,230 C 978,230 985,222 990,210" stroke-width="5.2" fill="none" />

    <!-- 'r' in Richard -->
