    <!-- Capital 'K' -->
    <!-- Downward stem with descent below baseline -->
    <path d="M 545,55 C 532,110 508,210 488,310 C 484,330 480,338 476,332" stroke-width="6.8" fill="none" />
    <!-- Upper right loop and branch of K -->
    <path d="M 522,145 C 542,118 575,82 585,88 C 592,94 580,120 545,160 C 535,172 522,182 515,188" stroke-width="6.0" fill="none" />
