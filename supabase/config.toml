[auth]
site_url = "https://g-app-pi.vercel.app"
additional_redirect_urls = ["https://g-app-pi.vercel.app/auth/password"]
enable_signup = false
minimum_password_length = 12

[auth.email]
# Keep the email provider enabled for existing sign-in and invitations.
# The global auth.enable_signup setting disables public registration.
enable_signup = true
enable_confirmations = true

[functions.gwcc-staff]
# Auth getUser and the reviewed root profile are checked in the handler. This
# also supports current asymmetric user JWTs, rather than the legacy gateway.
verify_jwt = false
entrypoint = "./functions/gwcc-staff/index.js"

[functions.gwcc-sms]
# The handler validates Auth getUser, reviewed staff roles, origin and quotas.
verify_jwt = false
entrypoint = "./functions/gwcc-sms/index.js"
